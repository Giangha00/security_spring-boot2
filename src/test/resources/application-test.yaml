spring:
  datasource:
    url: jdbc:h2:mem:catalogtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    issuer: catalog-api
    ttl: 15m
    active-kid: test-key-1
    keys:
      - kid: test-key-1
        public-key: classpath:keys/test.pub
        private-key: classpath:keys/test.key
      - kid: test-key-2
        public-key: classpath:keys/test2.pub
        private-key: classpath:keys/test2.key
  seed-admin:
    enabled: true
    username: admin
    password: Admin#Test2026
  rate-limit:
    limit-per-minute: 10

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
